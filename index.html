<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Teacher & Student English</title>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<meta name="description" content="Personal English learning platform for one student and one teacher: CEFR placement, English File course map, practice, homework, review and progress.">
<style>
:root{
  --bg:#f5f6f8;--surface:#fff;--surface2:#eef1f5;--text:#1b1f24;--muted:#5d6673;--border:#e1e5eb;
  --accent:#2f6fde;--accent-soft:#e7efff;--ok:#1d8f4e;--ok-soft:#e3f5ea;--bad:#cf3f3f;--bad-soft:#fde8e8;
  --warn:#b26d00;--warn-soft:#fff2d9;--shadow:0 1px 2px rgba(0,0,0,.04),0 3px 10px rgba(0,0,0,.04);
  --c-grammar:#f7c6c6;--c-vocabulary:#c9dcff;--c-spelling:#ffe1a8;--c-punctuation:#d9ccff;--c-style:#c8efd9;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1216;--surface:#171b21;--surface2:#1f242c;--text:#e6e9ee;--muted:#9aa4b2;--border:#2a313b;
  --accent:#74a3ff;--accent-soft:#1c2943;--ok:#4cc38a;--ok-soft:#14301f;--bad:#f07a7a;--bad-soft:#3a1c1e;
  --warn:#e8b04a;--warn-soft:#382c13;--shadow:none;
  --c-grammar:#5c2a2a;--c-vocabulary:#243d66;--c-spelling:#5a4416;--c-punctuation:#3d3166;--c-style:#1e4a33;
}}
:root[data-theme="dark"]{
  --bg:#0f1216;--surface:#171b21;--surface2:#1f242c;--text:#e6e9ee;--muted:#9aa4b2;--border:#2a313b;
  --accent:#74a3ff;--accent-soft:#1c2943;--ok:#4cc38a;--ok-soft:#14301f;--bad:#f07a7a;--bad-soft:#3a1c1e;
  --warn:#e8b04a;--warn-soft:#382c13;--shadow:none;
  --c-grammar:#5c2a2a;--c-vocabulary:#243d66;--c-spelling:#5a4416;--c-punctuation:#3d3166;--c-style:#1e4a33;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.5}
a{color:var(--accent)}
h1{font-size:24px;margin:0 0 4px}h2{font-size:18px;margin:0 0 10px}h3{font-size:16px;margin:0 0 8px}
p{margin:0 0 10px}
.muted{color:var(--muted)}.small{font-size:13px}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);grid-template-rows:56px 1fr;min-height:100vh}
header.top{grid-column:1/-1;display:flex;align-items:center;gap:10px;padding:0 16px;background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:30}
.brand{font-weight:700;display:flex;gap:8px;align-items:center;text-decoration:none;color:var(--text)}
.brand .logo{width:28px;height:28px;border-radius:8px;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:13px}
.spacer{flex:1}
nav.side{border-right:1px solid var(--border);background:var(--surface);padding:10px 8px;position:sticky;top:56px;height:calc(100vh - 56px);overflow:auto}
nav.side a{display:flex;gap:10px;align-items:center;padding:7px 10px;border-radius:8px;color:var(--text);text-decoration:none;font-size:14px}
nav.side a:hover{background:var(--surface2)}
nav.side a.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
nav.side .sep{height:1px;background:var(--border);margin:8px 6px}
nav.side .grp{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:12px 10px 4px}
main{padding:24px;max-width:1120px;width:100%}
@media(max-width:860px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:56px auto 1fr}
  nav.side{position:sticky;top:56px;height:auto;display:flex;overflow-x:auto;border-right:0;border-bottom:1px solid var(--border);padding:6px 8px;z-index:25}
  nav.side a{white-space:nowrap;flex:none}nav.side .sep,nav.side .grp{display:none}
  main{padding:16px}
  .hide-m{display:none}
}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;box-shadow:var(--shadow);min-width:0}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(min(100%,160px),1fr))}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.stack>*+*{margin-top:12px}
.page-head{margin-bottom:18px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--accent);background:var(--accent);color:#fff;padding:8px 14px;border-radius:9px;font:inherit;font-weight:600;cursor:pointer;text-decoration:none;font-size:14px}
.btn:hover{filter:brightness(1.07)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.plain{background:var(--surface2);border-color:var(--border);color:var(--text)}
.btn.danger{background:transparent;border-color:var(--bad);color:var(--bad)}
.btn.sm{padding:4px 10px;font-size:13px;border-radius:7px}
.btn.lg{padding:12px 18px;font-size:16px}
.iconbtn{border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:9px;height:36px;min-width:36px;padding:0 10px;cursor:pointer;font:inherit;position:relative}
.dot{position:absolute;top:-5px;right:-5px;background:var(--bad);color:#fff;border-radius:10px;font-size:11px;padding:0 5px;line-height:17px}
.badge{display:inline-block;padding:1px 8px;border-radius:20px;font-size:12px;font-weight:600;background:var(--surface2);color:var(--muted);white-space:nowrap}
.badge.ok{background:var(--ok-soft);color:var(--ok)}.badge.bad{background:var(--bad-soft);color:var(--bad)}
.badge.warn{background:var(--warn-soft);color:var(--warn)}.badge.acc{background:var(--accent-soft);color:var(--accent)}
.chip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--border);background:var(--surface2);border-radius:20px;padding:4px 12px;font-size:14px;cursor:pointer;font:inherit;color:var(--text)}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
input[type=text],input[type=time],input[type=email],input[type=password],input[type=number],input[type=datetime-local],input[type=search],select,textarea{font:inherit;color:var(--text);background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:8px 10px;width:100%;max-width:100%}
textarea{min-height:90px;resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
label.f{display:block;font-size:13px;color:var(--muted);margin-bottom:10px}
label.f>input,label.f>select,label.f>textarea{margin-top:4px}
.bar{height:8px;border-radius:8px;background:var(--surface2);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:8px}
.kpi{font-size:28px;font-weight:700;line-height:1.1}
.kpi small{font-size:13px;font-weight:500;color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--border);vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.03em}
.tbl{overflow-x:auto}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.list-item{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border)}
.list-item:last-child{border-bottom:0}
details.ru{display:inline-block;vertical-align:middle;margin-left:4px}
details.ru>summary{list-style:none;cursor:pointer;font-size:14px;display:inline}
details.ru>summary::-webkit-details-marker{display:none}
details.ru[open]>div{display:block;margin-top:6px;background:var(--warn-soft);border-radius:8px;padding:8px 10px;font-size:14px;color:var(--text)}
details.ru[open]{display:block}
/* quiz */
.qcard{max-width:720px}
.qtext{font-size:20px;font-weight:600;margin:6px 0 16px}
.opts{display:grid;gap:10px}
.opt{text-align:left;border:1.5px solid var(--border);background:var(--surface);color:var(--text);border-radius:10px;padding:12px 14px;font:inherit;font-size:16px;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.fb{border-radius:10px;padding:12px 14px;margin:14px 0}
.fb.ok{background:var(--ok-soft)}.fb.bad{background:var(--bad-soft)}
.words{display:flex;flex-wrap:wrap;gap:8px;min-height:44px;padding:8px;border:1.5px dashed var(--border);border-radius:10px;margin-bottom:10px}
.passage{white-space:pre-wrap;line-height:1.7}
.w{cursor:pointer;border-radius:4px}.w:hover{background:var(--accent-soft)}
/* flashcard */
.flash{min-height:220px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px}
.flash .word{font-size:32px;font-weight:700}
/* writing review */
.revtext{white-space:pre-wrap;line-height:1.8;font-size:16px;padding:14px;border:1px solid var(--border);border-radius:10px;background:var(--surface)}
mark.hl{color:inherit;border-radius:3px;padding:1px 0}
.c-Grammar{background:var(--c-grammar)}.c-Vocabulary{background:var(--c-vocabulary)}.c-Spelling{background:var(--c-spelling)}.c-Punctuation{background:var(--c-punctuation)}.c-Style{background:var(--c-style)}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:middle}
/* course map */
.files{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr))}
.lesson{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;border:1px solid var(--border);text-decoration:none;color:var(--text);margin-top:6px}
.lesson:hover{border-color:var(--accent)}
.st{width:10px;height:10px;border-radius:50%;flex:none;background:var(--surface2);border:1.5px solid var(--muted)}
.st.prog{background:var(--warn);border-color:var(--warn)}.st.done{background:var(--accent);border-color:var(--accent)}.st.great{background:var(--ok);border-color:var(--ok)}
.heat{display:grid;grid-template-columns:minmax(120px,1fr) 70px;gap:4px;align-items:center;font-size:13px}
.heat .cell{border-radius:6px;text-align:center;padding:4px;font-weight:600}
svg text{fill:var(--muted);font-size:11px;font-family:inherit}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:100;font-size:14px;max-width:calc(100% - 32px);box-shadow:0 4px 18px rgba(0,0,0,.2)}
.panel{position:absolute;right:16px;top:52px;width:min(360px,calc(100vw - 32px));max-height:70vh;overflow:auto;z-index:50}
.pop{position:fixed;z-index:60;width:min(280px,calc(100vw - 32px))}
.login{min-height:100vh;display:grid;place-items:center;padding:16px}
.role{text-align:left;cursor:pointer;border:1.5px solid var(--border);font:inherit;color:var(--text)}
.role:hover{border-color:var(--accent)}
.empty{text-align:center;padding:24px;color:var(--muted)}
.rec{width:12px;height:12px;border-radius:50%;background:var(--bad);display:inline-block;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.3}}
.phase{border-left:3px solid var(--accent);padding-left:12px}
.arch{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr))}
.arch .card{text-align:center}
@media print{nav.side,header.top,.no-print{display:none!important}.app{display:block}main{max-width:none}}
</style>

<body>
<div id="root"></div>
<script>
'use strict';
/* ============================================================
   CONTENT (original material — nothing copied from English File)
   ============================================================ */
const LV5=['A1','A2','B1','B2','C1'];
const LVNUM={A1:0,A2:1,B1:2,'B1+':2.5,B2:3,C1:4};
const CATS=['Grammar','Vocabulary','Spelling','Punctuation','Style'];

const mc=(id,q,opts,a,exp,ru)=>({id,type:'mc',q,opts,a,exp,ru});
const gap=(id,q,a,exp,ru)=>({id,type:'gap',q,a,exp,ru});
const fix=(id,bad,a,exp,ru)=>({id,type:'fix',q:`Correct the mistake: “${bad}”`,a,exp,ru});
const ord=(id,a,exp,ru)=>({id,type:'order',q:'Put the words in the correct order.',a,exp,ru});
const tf=(id,q,a,exp,ru)=>({id,type:'tf',q,a,exp,ru});

const GRAMMAR={
 'present-simple-continuous':{title:'Present Simple vs Present Continuous',level:'A2',
  en:`<p>Use the <b>Present Simple</b> for habits, routines and facts: <i>I work in a bank. Water boils at 100°C.</i></p><p>Use the <b>Present Continuous</b> (am / is / are + -ing) for actions happening now or around now, and for temporary situations: <i>I'm reading a great book this week.</i></p><p><b>Stative verbs</b> (know, like, want, believe, need) are normally not used in the continuous: <i>I know</i>, not <i>I'm knowing</i>.</p>`,
  ru:'Present Simple — привычки, распорядок, факты. Present Continuous — действие происходит сейчас или временно. Глаголы состояния (know, like, want, need) обычно не используются в Continuous.',
  qs:[mc('g-psc-1','Listen! Someone ___ at the door.',['knocks','is knocking','knock'],1,'The action is happening now → Present Continuous.','Действие происходит прямо сейчас.'),
      mc('g-psc-2','My brother ___ in a bank. It\'s his job.',['works','is working','work'],0,'A permanent situation → Present Simple.','Постоянная ситуация — Present Simple.'),
      gap('g-psc-3','I usually ___ (drink) tea in the morning.',['drink'],'“Usually” = a habit → Present Simple.','Usually указывает на привычку.'),
      ord('g-psc-4','she is studying for an exam this week','“This week” = temporary → Present Continuous: subject + is + -ing.','Временная ситуация на этой неделе.'),
      fix('g-psc-5','I am knowing the answer.',['I know the answer.'],'“Know” is a stative verb — no continuous form.','Know — глагол состояния.')]},
 'past-simple':{title:'Past Simple',level:'A2',
  en:`<p>Use the <b>Past Simple</b> for finished actions at a specific time in the past: <i>I visited Turkey in 2022.</i></p><p>Regular verbs add <b>-ed</b>; many common verbs are irregular (go → went, buy → bought).</p><p>Questions and negatives use <b>did</b> + infinitive: <i>Did you see it? I didn't go.</i></p>`,
  ru:'Законченное действие в прошлом с указанием времени. В вопросах и отрицаниях — did + начальная форма глагола (не “didn\'t went”).',
  qs:[mc('g-ps-1','We ___ to Almaty last summer.',['go','went','have gone'],1,'“Last summer” is a finished time → Past Simple.','Last summer — законченный период.'),
      gap('g-ps-2','She ___ (buy) a new phone yesterday.',['bought'],'Buy is irregular: buy → bought.','Неправильный глагол buy — bought.'),
      mc('g-ps-3','___ you see the match last night?',['Did','Do','Were'],0,'Past Simple questions use did + infinitive.','Вопрос в Past Simple — Did.'),
      fix('g-ps-4','He didn\'t went to school.',['He didn\'t go to school.'],'After didn\'t use the infinitive: didn\'t go.','После didn\'t — начальная форма.'),
      ord('g-ps-5','what time did you get up','Question word + did + subject + infinitive.','Вопросительное слово + did + подлежащее + глагол.')]},
 'past-continuous':{title:'Past Continuous',level:'A2',
  en:`<p><b>was / were + -ing</b> describes an action in progress at a moment in the past.</p><p>It is often interrupted by a shorter Past Simple action: <i>I was cooking when the phone rang.</i></p>`,
  ru:'Длительное действие в прошлом, которое часто прерывается коротким действием в Past Simple.',
  qs:[mc('g-pc-1','I ___ dinner when the phone rang.',['cooked','was cooking','am cooking'],1,'Longer background action → Past Continuous.','Фоновое длительное действие.'),
      gap('g-pc-2','While they ___ (walk) home, it started to rain.',['were walking'],'“While” + action in progress → were walking.','While — действие в процессе.'),
      mc('g-pc-3','What ___ you doing at 8 o\'clock yesterday?',['did','were','was'],1,'Past Continuous question: were + you + -ing.','Вопрос: were you doing.'),
      tf('g-pc-4','In “When she arrived, we had lunch”, lunch started after she arrived.',true,'Two Past Simple actions → one after the other.','Два Past Simple — последовательные действия.'),
      fix('g-pc-5','She was sleep when I called.',['She was sleeping when I called.'],'was + -ing form: was sleeping.','Нужна форма -ing.')]},
 'future-forms':{title:'Future forms: going to / will / Present Continuous',level:'B1',
  en:`<p><b>be going to</b> — plans and predictions based on evidence: <i>Look at the sky — it's going to rain.</i></p><p><b>will</b> — instant decisions, offers, promises and opinions: <i>I'll help you. I think she'll win.</i></p><p><b>Present Continuous</b> — fixed arrangements: <i>I'm meeting Ali at six.</i></p>`,
  ru:'going to — планы и прогнозы по явным признакам; will — спонтанные решения, обещания, мнения; Present Continuous — договорённости.',
  qs:[mc('g-ff-1','Look at those clouds! It ___ rain.',['will','is going to','rains'],1,'Prediction based on evidence → going to.','Прогноз по видимым признакам.'),
      mc('g-ff-2','A: I\'m cold. B: I ___ close the window.',['\'ll','am going to','close'],0,'Instant decision → will (\'ll).','Решение в момент речи.'),
      mc('g-ff-3','We ___ our grandparents on Sunday — it\'s all arranged.',['visit','are visiting','will visit'],1,'Fixed arrangement → Present Continuous.','Договорённость.'),
      gap('g-ff-4','I think Kazakhstan ___ (win) the match.',['will win'],'Opinion with “I think” → will.','Мнение — will.'),
      ord('g-ff-5','are you going to study tonight','Question: are + you + going to + infinitive.','Вопрос с going to.')]},
 'present-perfect':{title:'Present Perfect vs Past Simple',level:'B1',
  en:`<p><b>have / has + past participle</b> connects the past with now: experiences (<i>I've been to Paris</i>), recent news, and unfinished periods with <b>for</b> / <b>since</b> (<i>I've lived here for five years</i>).</p><p>If you say <b>when</b> it happened (yesterday, in 2019, last week), use the <b>Past Simple</b>.</p>`,
  ru:'Опыт, результат к настоящему моменту, период до сейчас (for — в течение, since — с момента). Если указано конкретное время в прошлом — Past Simple.',
  qs:[mc('g-pp-1','I ___ never ___ sushi.',['have … eaten','did … eat','has … ate'],0,'Life experience → Present Perfect.','Жизненный опыт.'),
      mc('g-pp-2','She ___ to London in 2019.',['has gone','went','has been'],1,'“In 2019” = specific past time → Past Simple.','Конкретное время — Past Simple.'),
      gap('g-pp-3','Have you ever ___ (be) to Turkey?',['been'],'Past participle of be = been.','Третья форма be — been.'),
      mc('g-pp-4','I\'ve lived here ___ five years.',['since','for','ago'],1,'For + a period of time.','For + период.'),
      fix('g-pp-5','I have seen him yesterday.',['I saw him yesterday.'],'“Yesterday” → Past Simple, not Present Perfect.','С yesterday — Past Simple.')]},
 'comparatives':{title:'Comparatives & superlatives',level:'A2',
  en:`<p>Short adjectives: <b>-er / the -est</b> (cheap → cheaper → the cheapest).</p><p>Long adjectives: <b>more / the most</b> (expensive → more expensive).</p><p>Irregular: good → better → the best; bad → worse → the worst. Use <b>than</b> after comparatives.</p>`,
  ru:'Короткие прилагательные: -er / -est; длинные: more / most; исключения good, bad. После сравнительной степени — than.',
  qs:[gap('g-cs-1','This flat is ___ (big) than our old one.',['bigger'],'Big → bigger (double the g).','Удвоение согласной: bigger.'),
      mc('g-cs-2','It\'s the ___ day of the year.',['hotter','hottest','most hot'],1,'Superlative of hot → the hottest.','Превосходная степень.'),
      mc('g-cs-3','My sister is ___ than me.',['more tall','taller','tallest'],1,'Short adjective → -er.','Короткое прилагательное.'),
      fix('g-cs-4','This book is more interesting that the film.',['This book is more interesting than the film.'],'Comparatives use “than”, not “that”.','После сравнения — than.'),
      gap('g-cs-5','Today is the ___ (good) day of my life!',['best'],'Good → better → the best.','Исключение: good — best.')]},
 'modals-obligation':{title:'must / have to / should',level:'B1',
  en:`<p><b>must</b> — strong obligation (often the speaker's opinion); <b>have to</b> — obligation from rules or circumstances.</p><p><b>mustn't</b> — prohibition; <b>don't have to</b> — not necessary; <b>should</b> — advice.</p>`,
  ru:'mustn\'t — нельзя; don\'t have to — не обязательно; should — совет.',
  qs:[mc('g-mo-1','You ___ smoke in the hospital. It\'s forbidden.',['mustn\'t','don\'t have to','shouldn\'t'],0,'Prohibition → mustn\'t.','Запрет — mustn\'t.'),
      mc('g-mo-2','Tomorrow is Saturday, so I ___ get up early.',['mustn\'t','don\'t have to','can\'t'],1,'Not necessary → don\'t have to.','Нет необходимости.'),
      mc('g-mo-3','You look tired. You ___ go to bed earlier.',['should','must','have'],0,'Advice → should.','Совет — should.'),
      gap('g-mo-4','Do you ___ wear a uniform at work?',['have to'],'Question about rules → Do you have to…?','Вопрос о правилах.'),

  const cands=Object.keys(GRAMMAR).filter(t=>S.topicStats[t]&&S.topicStats[t].t>=3).sort((a,b)=>topicAcc(a)-topicAcc(b));
  if(cands.length&&topicAcc(cands[0])<0.9)return cands[0];
  const lp=lastPlacement();const g=lp&&lp.weak&&lp.weak.map(w=>PL_GKEY[w]).find(Boolean);
  return g||Object.keys(GRAMMAR).find(t=>!S.topicStats[t])||'present-perfect';
}
function recommendBook(m){
  const B=[['Beginner',0,0.5],['Elementary',0.5,1],['Pre-intermediate',1,1.75],['Intermediate',1.75,2.25],['Intermediate Plus',2.25,2.75],['Upper-intermediate',2.75,3.5],['Advanced',3.5,4.01]];
  const b=B.find(x=>m<x[2])||B[B.length-1];const pos=(m-b[1])/(b[2]-b[1]);
  return {book:b[0],file:Math.max(1,Math.min(9,1+Math.floor(pos*9)))};
}
function pushLevel(skillsPatch,source,extra){
  const base=latestLevel();const skills=Object.assign({grammar:null,reading:null,listening:null,writing:null,speaking:null},base?base.skills:{},skillsPatch);
  const vals=Object.values(skills).filter(v=>v!=null);const overall=mean(vals);
  const e=Object.assign({id:uid(),date:new Date().toISOString(),overall,skills,source},extra||{});S.levels.push(e);return e;
}
function ru(text){return S.settings.ruHints&&text?`<details class="ru"><summary title="Подсказка на русском" aria-label="Russian hint">🇷🇺</summary><div>${text}</div></details>`:''}
function srsNext(c,q){const x={...c};if(q<3){x.reps=0;x.interval=1}else{x.reps++;x.interval=x.reps===1?1:x.reps===2?6:Math.round(x.interval*x.ef)}
  x.ef=Math.max(1.3,x.ef+(0.1-(5-q)*(0.08+(5-q)*0.02)));x.due=dkey(addDays(new Date(),q<3?0:x.interval));return x}
function basicCheck(text,task){
  const out=[];const n=wc(text);
  if(task&&n<task.min)out.push(['Structure',`Too short: ${n} words (aim for ${task.min}–${task.max}).`]);
  if(task&&n>task.max)out.push(['Structure',`Too long: ${n} words (limit ${task.max}).`]);
  const rules=[[/\bi\b/,'Grammar','Write the pronoun “I” with a capital letter.'],[/\b(\w+) \1\b/i,'Style','A word is repeated twice in a row.'],
   [/\bmore \w+er\b/i,'Grammar','Don\'t combine “more” with an -er comparative (e.g. “more better”).'],[/\bdid(n't| not) \w+ed\b/i,'Grammar','After did/didn\'t use the infinitive (e.g. “didn\'t go”).'],
   [/\b(i|you|we|they) am\b|\bi are\b|\bi is\b/i,'Grammar','Check the form of “to be”.'],[/\bi am agree\b/i,'Grammar','Say “I agree”, not “I am agree”.'],[/\bpeople is\b/i,'Grammar','“People” is plural: people are.'],
   [/\b(informations|advices|furnitures|homeworks)\b/i,'Vocabulary','This noun is uncountable — no -s.'],[/\bexplain me\b/i,'Grammar','Say “explain to me”.'],[/\bdiscuss about\b/i,'Grammar','Say “discuss something” (no “about”).'],
   [/\bsince \d+ (years|months|days)\b/i,'Grammar','Use “for” with a period of time.'],[/\bif [^.]*\bwill\b[^.]*,/i,'Grammar','Don\'t use “will” in the if-clause.'],[/ {2,}/,'Punctuation','Double space found.']];
  rules.forEach(([re,c,m])=>{if(re.test(text))out.push([c,m])});
  const sents=text.split(/(?<=[.!?])\s+/).filter(s=>s.trim());
  if(sents.some(s=>/^[a-z]/.test(s.trim())))out.push(['Punctuation','Start every sentence with a capital letter.']);
  if(sents.some(s=>wc(s)>35))out.push(['Style','Some sentences are very long (35+ words). Consider splitting them.']);
  if(text.trim()&&!/[.!?]["”']?$/.test(text.trim()))out.push(['Punctuation','The text does not end with a full stop.']);
  const freq={};(text.toLowerCase().match(/\b(very|good|nice|thing|things|really|bad|big)\b/g)||[]).forEach(w=>freq[w]=(freq[w]||0)+1);
  Object.entries(freq).filter(([,c])=>c>=3).forEach(([w,c])=>out.push(['Vocabulary',`“${w}” is used ${c} times — try a more precise word.`]));
  return out;
}

function radar(skills,size=280){
  const keys=['grammar','reading','listening','writing','speaking'];const labels=['Grammar & Vocab','Reading','Listening','Writing','Speaking'];
  const n=keys.length,cx=size/2,cy=size/2,R=size/2-48;
  const pt=(i,v)=>{const a=-Math.PI/2+i*2*Math.PI/n,r=R*v/4;return [cx+r*Math.cos(a),cy+r*Math.sin(a)]};
  let g='';for(let v=1;v<=4;v++)g+=`<polygon points="${keys.map((_,i)=>pt(i,v).join(',')).join(' ')}" style="fill:none;stroke:var(--border)"/>`;
  keys.forEach((_,i)=>{const [x,y]=pt(i,4);g+=`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" style="stroke:var(--border)"/>`});
  for(let v=1;v<=4;v++){const [x,y]=pt(0,v);g+=`<text x="${x+4}" y="${y+3}">${LV5[v]}</text>`}
  const pts=keys.map((k,i)=>pt(i,skills&&skills[k]!=null?skills[k]:0));
  g+=`<polygon points="${pts.map(p=>p.join(',')).join(' ')}" style="fill:var(--accent);fill-opacity:.22;stroke:var(--accent);stroke-width:2"/>`;
  keys.forEach((k,i)=>{const [x,y]=pts[i];if(skills&&skills[k]!=null)g+=`<circle cx="${x}" cy="${y}" r="3.5" style="fill:var(--accent)"/>`;
    const [lx,ly]=pt(i,4.75);const v=skills&&skills[k]!=null?cefr(skills[k]):'—';g+=`<text x="${lx}" y="${ly}" text-anchor="middle" style="font-size:11px">${labels[i]}</text><text x="${lx}" y="${ly+13}" text-anchor="middle" style="font-weight:700;fill:var(--text)">${v}</text>`});
  return `<svg viewBox="0 0 ${size} ${size}" width="100%" style="max-width:${size+20}px" role="img" aria-label="Skill profile radar chart">${g}</svg>`;
}
function lineChart(levels){
  if(levels.length<1)return '<div class="empty">No level data yet.</div>';
  const W=520,H=200,L=36,B=28,T=12,Rr=12;const n=levels.length;
  const x=i=>n===1?L+(W-L-Rr)/2:L+i*(W-L-Rr)/(n-1);const y=v=>T+(H-T-B)*(1-v/4);
  let g='';for(let v=0;v<=4;v++)g+=`<line x1="${L}" x2="${W-Rr}" y1="${y(v)}" y2="${y(v)}" style="stroke:var(--border)"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end">${LV5[v]}</text>`;
  g+=`<polyline points="${levels.map((l,i)=>x(i)+','+y(l.overall||0)).join(' ')}" style="fill:none;stroke:var(--accent);stroke-width:2.5"/>`;
  levels.forEach((l,i)=>{g+=`<circle cx="${x(i)}" cy="${y(l.overall||0)}" r="4" style="fill:var(--accent)"><title>${fmtD(l.date)}: ${cefr(l.overall)} (${l.source})</title></circle>`;if(n<=8||i%Math.ceil(n/8)===0)g+=`<text x="${x(i)}" y="${H-8}" text-anchor="middle">${new Date(l.date).toLocaleDateString('en-GB',{day:'numeric',month:'short'})}</text>`});
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Overall level over time">${g}</svg>`;
}
function barChart(days=14){
  const W=520,H=170,L=30,B=26,T=10;const data=[];for(let i=days-1;i>=0;i--){const d=addDays(new Date(),-i);data.push([d,S.activity[dkey(d)]||0])}
  const max=Math.max(10,...data.map(d=>d[1]));const bw=(W-L)/days;let g='';
  [0,max/2,max].forEach(v=>{const y=T+(H-T-B)*(1-v/max);g+=`<line x1="${L}" x2="${W}" y1="${y}" y2="${y}" style="stroke:var(--border)"/><text x="${L-6}" y="${y+4}" text-anchor="end">${Math.round(v)}</text>`});
  data.forEach(([d,m],i)=>{const h=(H-T-B)*m/max;g+=`<rect x="${L+i*bw+3}" y="${H-B-h}" width="${bw-6}" height="${h}" rx="3" style="fill:var(--accent)"><title>${dkey(d)}: ${Math.round(m)} min</title></rect>`;if(i%2===0||days<=7)g+=`<text x="${L+i*bw+bw/2}" y="${H-8}" text-anchor="middle">${d.getDate()}</text>`});
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Minutes of practice per day">${g}</svg>`;
}
function heatmap(){
  const rows=Object.keys(GRAMMAR).map(t=>{const a=topicAcc(t);const s=S.topicStats[t];
    const bg=a==null?'var(--surface2)':`color-mix(in srgb, var(--ok) ${Math.round(a*100)}%, var(--bad))`;
    return `<a href="#/grammar/${t}" class="small" style="color:var(--text)">${esc(GRAMMAR[t].title)}</a><div class="cell" style="background:${bg};color:${a==null?'var(--muted)':'#fff'}" title="${s?s.c+'/'+s.t:'no data'}">${a==null?'—':Math.round(a*100)+'%'}</div>`}).join('');
  return `<div class="heat">${rows}</div>`;

function highlight(text,comments,withNums){
  const cs=(comments||[]).map((c,i)=>({...c,n:i+1})).filter(c=>c.start!=null).sort((a,b)=>a.start-b.start);let out='',pos=0;
  cs.forEach(c=>{if(c.start<pos)return;out+=esc(text.slice(pos,c.start))+`<mark class="hl c-${c.cat}" title="${esc(c.cat+': '+c.text)}">${esc(text.slice(c.start,c.end))}</mark>${withNums?`<sup>${c.n}</sup>`:''}`;pos=c.end});
  return out+esc(text.slice(pos));
}

function vRun(){
  const r=RUN;if(!r){setTimeout(()=>go(home()));return ''}
  if(r.state==='done')return runSummary();
  const q=r.q;const fbk=r.state==='feedback';let ctx='';
  if(q.passage){const p=PASSAGES[q.passage];ctx=`<div class="card" style="margin-bottom:12px"><h3>${esc(p.title)}</h3><p class="passage small">${esc(p.text)}</p></div>`}
  if(q.audio){const used=r.plays[q.audio]||0,lim=r.mode==='test'?2:99;ctx=`<div class="card row" style="margin-bottom:12px"><button class="btn" ${used>=lim?'disabled':''} onclick="A.playAudio('${q.audio}')">▶ Play recording</button><span class="small muted">${r.mode==='test'?`Plays left: ${lim-used}`:esc(AUDIO[q.audio].title)}</span></div>`}
  let body='';const ri=q.type==='tf'?(q.a?0:1):q.a;
  if(q.type==='mc'||q.type==='tf'){const opts=q.type==='tf'?['True','False']:q.opts;
    body=`<div class="opts">${opts.map((o,i)=>{let c='opt';if(fbk){if(i===ri)c+=' right';else if(i===r.lastGiven)c+=' wrong'}else if(r.sel===i)c+=' sel';return `<button class="${c}" ${fbk?'disabled':''} onclick="A.pick(${i})">${esc(o)}</button>`}).join('')}</div>
    ${r.mode==='test'&&!fbk?`<div class="row" style="margin-top:14px"><button class="btn" ${r.sel==null?'disabled':''} onclick="A.submitSel()">Next →</button></div>`:''}`}
  else if(q.type==='gap'||q.type==='fix'||q.type==='tr'){
    body=`<input type="text" id="ans" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="${q.type==='fix'?'Type the correct sentence':q.type==='tr'?'Type the sentence in English':'Type your answer'}" value="${esc(fbk?r.lastGiven:'')}" ${fbk?'disabled':''} onkeydown="if(event.key==='Enter'){event.preventDefault();event.stopPropagation();A.submitText()}">
    ${!fbk?`<div class="row" style="margin-top:12px"><button class="btn" onclick="A.submitText()">${r.mode==='test'?'Next →':'Check'}</button></div>`:''}`}
  else if(q.type==='order'){const words=q.a.split(' ');
    body=`<div class="words" aria-label="Your sentence">${r.picked.map((wi,k)=>`<button class="chip on" ${fbk?'disabled':''} onclick="A.unpick(${k})">${esc(words[wi])}</button>`).join('')||'<span class="muted small">Click the words below…</span>'}</div>
    <div class="row">${r.shuf.filter(wi=>!r.picked.includes(wi)).map(wi=>`<button class="chip" ${fbk?'disabled':''} onclick="A.pickWord(${wi})">${esc(words[wi])}</button>`).join('')}</div>
    ${!fbk?`<div class="row" style="margin-top:12px"><button class="btn" ${r.picked.length<words.length?'disabled':''} onclick="A.submitOrder()">${r.mode==='test'?'Next →':'Check'}</button></div>`:''}`}
  const fb=fbk?`<div class="fb ${r.lastOk?'ok':'bad'}" role="status"><b>${r.lastOk?'✓ Correct!':'✗ Not quite.'}</b> ${r.lastOk?'':`Correct answer: <b>${esc(answerText(q))}</b>`}<div>${esc(q.exp||'')}</div>${ru(esc(q.ru||''))}</div><button class="btn" id="nextbtn" onclick="A.next()">Next →</button>`:'';
  const total=r.total||'?';

/* placement */
const GV_N=20;const PL_TAIL=[...PASSAGES.r1.qs,...PASSAGES.r2.qs,...PASSAGES.r3.qs,...AUDIO.l1.qs,...AUDIO.l2.qs,...AUDIO.l3.qs];
function placementNext(r){
  if(r.i<GV_N){if(r.p.seq[r.i])return ALLQ[r.p.seq[r.i]];
    for(let d=0;d<5;d++)for(const lv of [r.p.pos-d,r.p.pos+d]){const c=PLACEMENT.filter(q=>q.lv===lv&&!r.p.seq.includes(q.id));if(c.length){const q=c[Math.floor(Math.random()*c.length)];r.p.seq.push(q.id);return q}}
    return null}
  return PL_TAIL[r.i-GV_N]||null;
}
A.startPlacement=resume=>{
  const d=resume&&S.placementDraft;
  startRun({title:'Placement test',mode:'test',kind:'placement',total:GV_N+PL_TAIL.length,p:d?d.p:{seq:[],pos:1},back:'/placement',
    next:placementNext,
    onAnswer:(r,q,ok)=>{if(r.i<GV_N)r.p.pos=Math.max(0,Math.min(4,r.p.pos+(ok?1:-1)))},
    onStep:r=>{S.placementDraft={i:r.i,p:r.p,answers:r.answers,start:r.start,plays:r.plays}},
    onFinish:r=>{S.placementDraft=null;computePlacement(r);setTimeout(()=>{RUN=null;go('/placement-result')},0)}},
   d?{i:d.i,answers:d.answers,start:d.start,plays:d.plays||{}}:null);
  if(!d)S.placementDraft={i:0,p:RUN.p,answers:[],start:RUN.start,plays:{}};save();
};
A.discardPlacement=()=>{if(confirm('Discard your unfinished test and start again?')){S.placementDraft=null;save();A.startPlacement(false)}};
function computePlacement(r){
  const gv=r.answers.slice(0,GV_N);const lvls=gv.map(a=>ALLQ[a.qid].lv);
  let g=mean(lvls.slice(Math.min(6,lvls.length-1)));if(gv.length){const last=gv[gv.length-1];g+=last.ok?0.3:-0.3}g=Math.max(0,Math.min(4,g||0));
  const tier=(keys,src)=>{let v=0.3;for(const k of keys){const qs=src[k].qs.map(q=>q.id);const c=r.answers.filter(a=>qs.includes(a.qid)&&a.ok).length;if(c>=2)v=src[k].lv;else break}return v};
  const read=tier(['r1','r2','r3'],PASSAGES),listen=tier(['l1','l2','l3'],AUDIO);
  const weak=[...new Set(gv.filter(a=>!a.ok).map(a=>a.topic))].slice(0,5);
  const skills={grammar:g,reading:read,listening:listen};const overall=mean(Object.values(skills));const rec=recommendBook(overall);
  pushLevel({...skills,writing:null,speaking:null},'placement',{weak,book:rec.book,file:rec.file});S.retakeAllowed=false;
  notify('teacher',`${S.users.student.name} completed the placement test: ${cefr(latestLevel().overall)}`,'/t/analytics');
}

A.addQ=()=>{const type=$('#nq-type').value,q=$('#nq-q').value.trim(),a=$('#nq-a').value.trim();if(!q)return toast('Write the question');if(!a)return toast('Give the correct answer');
  const base={id:'c-'+uid(),type,q,level:$('#nq-level').value,topic:$('#nq-topic').value,exp:$('#nq-exp').value.trim(),ru:$('#nq-ru').value.trim(),skill:$('#nq-topic').value==='Vocabulary'?'vocabulary':'grammar'};
  if(type==='mc'){const opts=$('#nq-opts').value.split('\n').map(s=>s.trim()).filter(Boolean);const n=parseInt(a,10);if(opts.length<2)return toast('Add at least 2 options');if(!(n>=1&&n<=opts.length))return toast('Correct answer must be an option number 1–'+opts.length);Object.assign(base,{opts,a:n-1})}
  else if(type==='tf'){if(!/^(true|false)$/i.test(a))return toast('Answer must be true or false');base.a=/^true$/i.test(a)}
  else if(type==='order'){base.a=a.replace(/\s+/g,' ');base.q=q||'Put the words in the correct order.'}
  else base.a=a.split('|').map(s=>s.trim()).filter(Boolean);
  if(type==='fix')base.q=/^correct/i.test(q)?q:`Correct the mistake: “${q}”`;
  S.customQ[base.id]=base;ALLQ[base.id]=base;UI.tdraft.qids.push(base.id);save();toast('Question added');render()};
A.delQ=id=>{delete S.customQ[id];delete ALLQ[id];S.customTests.forEach(t=>t.qids=t.qids.filter(q=>q!==id));if(UI.tdraft)UI.tdraft.qids=UI.tdraft.qids.filter(q=>q!==id);save();render()};
A.saveTest=()=>{const d=UI.tdraft;if(!d.title.trim())return toast('Give the test a title');if(!d.qids.length)return toast('Add questions');
  const t={id:d.id||'t-'+uid(),title:d.title.trim(),timer:Math.max(0,d.timer|0),attempts:Math.max(0,d.attempts|0),shuffle:d.shuffle,showAnswers:d.showAnswers,qids:[...d.qids]};
  const i=S.customTests.findIndex(x=>x.id===t.id);if(i>=0)S.customTests[i]=t;else{S.customTests.push(t);notify('student',`New test from your teacher: ${t.title}`,'/tests')}
  UI.tdraft=null;UI.ttab='tests';save();toast('Test saved');render()};
A.editTest=id=>{const t=S.customTests.find(x=>x.id===id);UI.tdraft=JSON.parse(JSON.stringify(t));UI.ttab='edit';render()};
A.delTest=id=>{if(!confirm('Delete this test?'))return;S.customTests=S.customTests.filter(t=>t.id!==id);save();render()};

/* course editor */
A.ce=(bi,fi,li,k,v)=>{const b=S.course[bi];const o=li!=null?b.files[fi].lessons[li]:fi!=null?b.files[fi]:b;o[k]=v;save()};
A.ceAddLesson=(bi,fi)=>{const f=S.course[bi].files[fi];const code=f.n+String.fromCharCode(65+f.lessons.length);f.lessons.push({id:S.course[bi].id+'-'+uid(),code,title:'New lesson',grammar:Object.keys(GRAMMAR)[0],vocab:'',page:0});save();render()};
A.ceDel=(bi,fi,li)=>{if(!confirm('Delete this lesson?'))return;S.course[bi].files[fi].lessons.splice(li,1);save();render()};
A.ceAddFile=bi=>{const b=S.course[bi];b.files.push({n:b.files.length+1,title:'New File',lessons:[]});save();render()};
A.ceAddBook=()=>{S.course.push({id:'b'+uid(),title:'English File …',edition:'4th',cefr:'',files:[]});save();render()};
A.addNote=()=>{const t=$('#notein').value.trim();if(!t)return;S.notes.push({id:uid(),text:t,date:new Date().toISOString()});save();render()};
A.delNote=id=>{S.notes=S.notes.filter(n=>n.id!==id);save();render()};

/* ============================================================
   INIT
   ============================================================ */
load();indexQuestions();
window.addEventListener('hashchange',render);
document.addEventListener('focusout',()=>setTimeout(()=>{const a=document.activeElement;if(Cloud.pendingRender&&!(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))&&!Rec.active)Cloud.remoteRender()},150));
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&Cloud.on)Cloud.refresh();else if(Cloud.on&&Cloud.ready){cacheLocal();clearTimeout(Cloud.timer);Cloud.flush()}});
window.addEventListener('pagehide',()=>{try{cacheLocal()}catch(e){}if(Cloud.on&&Cloud.ready)Cloud.beacon()});
window.addEventListener('beforeunload',e=>{if(Cloud.on&&(Cloud.status==='saving'||Cloud.status==='offline')){e.preventDefault();e.returnValue=''}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&RUN&&RUN.state==='feedback'&&document.activeElement&&document.activeElement.tagName!=='BUTTON'){e.preventDefault();A.next()}});
document.addEventListener('click',e=>{const pop=$('#wordpop');if(pop&&pop.innerHTML&&!e.target.closest('.pop')&&!e.target.classList.contains('w'))pop.innerHTML='';
  if(UI.panel&&!e.target.closest('.panel')&&!e.target.closest('.iconbtn')){UI.panel=false;render()}});
async function boot(){
  if(!Cloud.on){render();return}
  render();
  if(!window.supabase){$('#root').innerHTML='<div class="login"><div class="card" style="max-width:420px"><h2>Cannot reach the server</h2><p class="muted">The Supabase library did not load. Check the internet connection and reload the page.</p><button class="btn" onclick="location.reload()">Reload</button></div></div>';return}
  try{
    Cloud.sb=window.supabase.createClient(TS_CONFIG.supabaseUrl,TS_CONFIG.supabaseAnonKey);
    const {data}=await Cloud.sb.auth.getSession();
    if(data&&data.session){const err=await Cloud.start(data.session.user);if(err)UI.loginErr=err}else S.role=null;
  }catch(e){console.error(e);UI.loginErr='Could not connect to Supabase. Check config.js.';S.role=null}
  Cloud.booted=true;render();
}
boot();
