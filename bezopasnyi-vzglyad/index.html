<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Безопасный взгляд</title>
<meta name="description" content="Платформа удалённого мониторинга промышленной безопасности НПЗ и учёта удалённого рабочего времени для сотрудников с ограниченными возможностями">
<style>
:root{
  --fs:1;
  --bg:#0e1318; --panel:#161e26; --panel2:#1d2832; --line:#2a3946; --text:#e7edf3; --muted:#93a3b3;
  --accent:#f5a524; --accent-ink:#1b1300; --ok:#3fb950; --bad:#ff5c52; --info:#58a6ff; --violet:#b48cff;
  --focus:#ffd400; --radius:12px;
}
:root[data-contrast="high"]{
  --bg:#000; --panel:#000; --panel2:#0b0b0b; --line:#fff; --text:#fff; --muted:#e6e6e6;
  --accent:#ffeb00; --accent-ink:#000; --ok:#00ff6a; --bad:#ff4040; --info:#5cc8ff; --violet:#ff9cff; --focus:#00ffff;
}
*{box-sizing:border-box}
html{font-size:calc(16px * var(--fs))}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Segoe UI",Roboto,Arial,sans-serif;line-height:1.45;min-height:100vh}
:root[data-motion="reduce"] *{transition:none!important;animation:none!important}
a{color:var(--info)}
h1{font-size:1.6rem;margin:0 0 .25rem}
h2{font-size:1.15rem;margin:0 0 .75rem}
h3{font-size:1rem;margin:0 0 .5rem}
p{margin:.25rem 0 .75rem}
.muted{color:var(--muted)}
.skip{position:absolute;left:-999px;top:0;background:var(--accent);color:var(--accent-ink);padding:.5rem 1rem;z-index:100}
.skip:focus{left:8px}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
button,select,input,textarea{font:inherit;color:inherit}
.btn{display:inline-flex;align-items:center;gap:.4rem;justify-content:center;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:.55rem .9rem;cursor:pointer;min-height:44px;text-decoration:none;color:var(--text)}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff;font-weight:600}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#03140a;font-weight:600}
.btn.sm{min-height:34px;padding:.3rem .6rem;font-size:.9rem}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
input[type=text],input[type=password],select,textarea{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:.55rem .7rem;min-height:44px;width:100%}
textarea{min-height:110px;resize:vertical}
label{display:block;font-weight:600;margin:0 0 .35rem}
.field{margin-bottom:1rem}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:1.1rem}
.row{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center}
.spacer{flex:1}

/* Header */
header.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:1rem;padding:.6rem 1rem;flex-wrap:wrap;max-width:1500px;margin:0 auto}
.brand{display:flex;align-items:center;gap:.6rem;font-weight:700;font-size:1.1rem;text-decoration:none;color:var(--text)}
.brand-mark{width:34px;height:34px;border-radius:50%;background:radial-gradient(circle at 50% 50%,var(--bg) 0 28%,var(--accent) 29% 46%,var(--bg) 47% 54%,var(--accent) 55% 100%);flex:none}
.brand small{display:block;font-weight:400;color:var(--muted);font-size:.72rem}
nav.main{display:flex;gap:.25rem;flex-wrap:wrap}
nav.main a{padding:.5rem .8rem;border-radius:10px;text-decoration:none;color:var(--muted);font-weight:600;position:relative}
nav.main a[aria-current="page"]{background:var(--panel2);color:var(--text);box-shadow:inset 0 -3px 0 var(--accent)}
.badge{display:inline-block;min-width:1.3em;padding:0 .35em;border-radius:99px;background:var(--bad);color:#fff;font-size:.72rem;text-align:center;margin-left:.3rem}
.shift-chip{display:flex;align-items:center;gap:.5rem;padding:.35rem .7rem;border-radius:99px;border:1px solid var(--line);font-variant-numeric:tabular-nums;font-size:.9rem}
.dot{width:10px;height:10px;border-radius:50%;background:var(--muted);flex:none}
.dot.on{background:var(--ok);box-shadow:0 0 0 4px color-mix(in srgb,var(--ok) 25%,transparent)}
.dot.pause{background:var(--accent)}
.a11y{display:flex;gap:.25rem}
.a11y .btn{min-width:44px;padding:.3rem .5rem}
main{max-width:1500px;margin:0 auto;padding:1.2rem 1rem 3rem}
.banner{display:flex;gap:.8rem;align-items:center;flex-wrap:wrap;padding:.7rem 1rem;border-radius:10px;border:1px solid var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent);margin-bottom:1rem}

/* Login */
.login-wrap{min-height:100vh;display:grid;place-items:center;padding:1rem}
.login{width:min(960px,100%);display:grid;grid-template-columns:1.1fr 1fr;gap:0;border:1px solid var(--line);border-radius:18px;overflow:hidden;background:var(--panel)}
.login-hero{padding:2rem;background:linear-gradient(160deg,#1f2c38,#0e1318);position:relative}
:root[data-contrast="high"] .login-hero{background:#000;border-right:1px solid #fff}
.login-hero h1{font-size:2rem;margin-top:1rem}
.login-hero ul{padding-left:1.1rem;color:var(--muted)}
.login-form{padding:2rem}
.demo-acc{display:grid;gap:.5rem;margin-top:1rem}
.demo-acc button{text-align:left;justify-content:flex-start}
.err{color:var(--bad);font-weight:600;min-height:1.4em}

/* Cabinet */
.cab{display:grid;grid-template-columns:repeat(12,1fr);gap:1rem}
.c4{grid-column:span 4}.c5{grid-column:span 5}.c7{grid-column:span 7}.c8{grid-column:span 8}.c6{grid-column:span 6}.c12{grid-column:span 12}
.avatar{width:64px;height:64px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;font-size:1.4rem;flex:none}
dl.kv{display:grid;grid-template-columns:auto 1fr;gap:.3rem 1rem;margin:.8rem 0 0}
dl.kv dt{color:var(--muted)} dl.kv dd{margin:0}
.timer{font-size:3rem;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.02em;margin:.3rem 0}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:.6rem}
.tile{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:.7rem}
.tile b{display:block;font-size:1.7rem;font-variant-numeric:tabular-nums}
.tile span{color:var(--muted);font-size:.85rem}
table{width:100%;border-collapse:collapse;font-size:.95rem}
th,td{text-align:left;padding:.5rem .6rem;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:600}
.tbl-wrap{overflow-x:auto}
.notif{display:flex;gap:.6rem;padding:.55rem 0;border-bottom:1px solid var(--line)}
.notif:last-child{border-bottom:0}
.notif.new{font-weight:600}

/* Status / severity tags */
.tag{display:inline-block;padding:.1rem .5rem;border-radius:99px;font-size:.8rem;font-weight:600;border:1px solid currentColor;white-space:nowrap}
.st-sent{color:var(--info)} .st-work{color:var(--accent)} .st-conf{color:var(--violet)} .st-rej{color:var(--muted)} .st-done{color:var(--ok)}
.sv-low{color:var(--ok)} .sv-mid{color:var(--accent)} .sv-high{color:#ff8a3d} .sv-crit{color:#fff;background:var(--bad);border-color:var(--bad)}
.overdue{color:#fff;background:var(--bad);border-color:var(--bad)}

/* Monitor */
.toolbar{display:flex;gap:1rem;align-items:flex-end;flex-wrap:wrap;margin-bottom:1rem}
.mon-wrap{display:grid;grid-template-columns:1fr 320px;gap:1rem;align-items:start}
.grid{display:grid;gap:.8rem}
.grid.g6{grid-template-columns:repeat(3,1fr)}
.grid.g4{grid-template-columns:repeat(2,1fr)}
.grid.g1{grid-template-columns:1fr}
.cam-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column}
.cam-card.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.cam-card.alarm{border-color:var(--bad)}
.screen{position:relative;background:#000;aspect-ratio:16/9}
.screen canvas{width:100%;height:100%;display:block}
.screen::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.12) 0 1px,transparent 1px 3px)}
.paused-tag{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.7);padding:.3rem .8rem;border-radius:8px;font-weight:700;display:none;z-index:2}
.cam-card.paused .paused-tag{display:block}
.cam-meta{padding:.55rem .75rem 0;display:flex;flex-direction:column}
.cam-meta span{color:var(--muted);font-size:.85rem}
.tele{display:flex;gap:.35rem;flex-wrap:wrap;padding:.5rem .75rem}
.tv{font-size:.78rem;padding:.15rem .45rem;border-radius:6px;background:var(--panel2);border:1px solid var(--line);font-variant-numeric:tabular-nums}
.tv.bad{border-color:var(--bad);color:#fff;background:color-mix(in srgb,var(--bad) 55%,transparent)}
.cam-actions{display:flex;gap:.4rem;padding:0 .75rem .75rem;margin-top:auto}
.cam-actions .btn{flex:1}
.cam-actions .btn.icon{flex:0 0 44px}
.hints .hint{border:1px solid var(--accent);border-radius:10px;padding:.7rem;margin-bottom:.6rem;background:color-mix(in srgb,var(--accent) 8%,transparent)}
.hint .row{margin-top:.5rem}
.legend li{margin:.25rem 0}

/* Report */
.report-grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem;align-items:start}
.types{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:.5rem;border:0;padding:0;margin:0 0 1rem}
.types legend,.sev legend{font-weight:600;margin-bottom:.4rem;padding:0}
.opt{position:relative}
.opt input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.opt span{display:flex;gap:.5rem;align-items:center;padding:.6rem .7rem;border:1px solid var(--line);border-radius:10px;background:var(--panel2);min-height:52px;font-weight:600;font-size:.92rem}
.opt input:checked + span{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent);background:color-mix(in srgb,var(--accent) 14%,var(--panel2))}
.opt input:focus-visible + span{outline:3px solid var(--focus);outline-offset:2px}
.ico{font-size:1.25rem}
.sev{display:flex;gap:.5rem;flex-wrap:wrap;border:0;padding:0;margin:0 0 1rem}
.sev .opt{flex:1;min-width:110px}
.snap{position:relative;background:#000;border-radius:10px;overflow:hidden;aspect-ratio:16/9;cursor:crosshair;border:1px solid var(--line)}
.snap img{width:100%;height:100%;display:block;object-fit:cover}
.snap .empty{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);text-align:center;padding:1rem;cursor:default}
.marker{position:absolute;width:56px;height:56px;margin:-28px 0 0 -28px;border:3px solid var(--bad);border-radius:50%;box-shadow:0 0 0 3px rgba(0,0,0,.6),0 0 18px var(--bad);pointer-events:none}
.marker::after{content:"!";position:absolute;inset:0;display:grid;place-items:center;font-weight:800;color:#fff;text-shadow:0 0 4px #000}
.route{padding:.7rem;border-radius:10px;background:var(--panel2);border:1px dashed var(--line);margin-bottom:1rem}

/* Kanban */
.kanban{display:grid;grid-template-columns:repeat(5,minmax(220px,1fr));gap:.8rem;overflow-x:auto;padding-bottom:.5rem}
.col{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:.7rem;min-height:200px}
.col h2{font-size:1rem;display:flex;justify-content:space-between}
.card{display:block;width:100%;text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:.6rem;margin-bottom:.55rem;cursor:pointer}
.card:hover{border-color:var(--muted)}
.card .thumb{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:6px;margin:.4rem 0;display:block;background:#000}
.card small{color:var(--muted);display:block}
.timeline{list-style:none;padding:0;margin:0;border-left:2px solid var(--line)}
.timeline li{padding:.2rem 0 .6rem 1rem;position:relative}
.timeline li::before{content:"";position:absolute;left:-7px;top:.5rem;width:12px;height:12px;border-radius:50%;background:var(--accent)}
.comment{background:var(--panel2);border-radius:10px;padding:.5rem .7rem;margin-bottom:.5rem}

/* Modal / toast */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:flex-start;justify-content:center;z-index:50;padding:2rem 1rem;overflow-y:auto}
.modal-bg.open{display:flex}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:16px;width:min(1100px,100%);padding:1.2rem}
.modal-head{display:flex;align-items:center;gap:1rem;margin-bottom:1rem}
.toasts{position:fixed;right:1rem;bottom:1rem;display:flex;flex-direction:column;gap:.5rem;z-index:60;max-width:min(420px,calc(100vw - 2rem))}
.toast{background:var(--panel2);border:1px solid var(--line);border-left:5px solid var(--info);border-radius:10px;padding:.7rem .9rem;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.toast.bad{border-left-color:var(--bad)} .toast.ok{border-left-color:var(--ok)} .toast.warn{border-left-color:var(--accent)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.detail-grid{display:grid;grid-template-columns:1.3fr 1fr;gap:1rem}

@media (max-width:1150px){.grid.g6{grid-template-columns:repeat(2,1fr)}.c4,.c5,.c7,.c8,.c6{grid-column:span 12}}
@media (max-width:1000px){.mon-wrap,.report-grid,.detail-grid{grid-template-columns:1fr}.login{grid-template-columns:1fr}}
@media (max-width:640px){.grid.g6,.grid.g4{grid-template-columns:1fr}.timer{font-size:2.3rem}h1{font-size:1.35rem}.top-in{gap:.5rem}}
</style>
</head>
<body>
<a class="skip" href="#main">Перейти к содержимому</a>
<div id="app"></div>
<div class="modal-bg" id="modalBg" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal" id="modal"></div></div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<div class="sr" id="live" aria-live="assertive"></div>

<script>
/* ================= Хранилище ================= */
const store={
  get(k,d){try{const v=localStorage.getItem('bv_'+k);return v?JSON.parse(v):d}catch(e){return d}},
  set(k,v){try{localStorage.setItem('bv_'+k,JSON.stringify(v))}catch(e){console.warn('storage',e)}}
};
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const pad=n=>String(n).padStart(2,'0');
const fmtDur=ms=>{ms=Math.max(0,ms);const s=Math.floor(ms/1000);return pad(Math.floor(s/3600))+':'+pad(Math.floor(s%3600/60))+':'+pad(s%60)};
const fmtH=ms=>(ms/3600000).toFixed(1).replace('.',',')+' ч';
const fmtDT=t=>new Date(t).toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
const fmtT=t=>new Date(t).toLocaleTimeString('ru-RU');
const ago=t=>{const m=Math.round((Date.now()-t)/60000);if(m<1)return'только что';if(m<60)return m+' мин назад';const h=Math.round(m/60);if(h<24)return h+' ч назад';return Math.round(h/24)+' дн назад'};

/* ================= Справочники ================= */
const USERS={
  '1001':{pass:'demo',role:'operator',name:'Каримова Динара Сериковна',pos:'Оператор-наблюдатель',curator:'Иванов С. П.',group:'Группа удалённого наблюдения №1',note:'Нарушение слуха — включены текстовые и световые оповещения'},
  '1002':{pass:'demo',role:'operator',name:'Ахметов Ерлан Болатович',pos:'Оператор-наблюдатель',curator:'Иванов С. П.',group:'Группа удалённого наблюдения №1',note:'Ограничение подвижности — работа с клавиатуры'},
  '2001':{pass:'demo',role:'specialist',name:'Петров Алексей Николаевич',pos:'Инженер промышленной безопасности',curator:'—',group:'Отдел промышленной безопасности',note:'Ответственный специалист'}
};
const CAMS=[
  {id:'CAM-01',unit:'ЭЛОУ-АВТ-6',name:'Колонна К-1, северная сторона',scene:'column'},
  {id:'CAM-02',unit:'Резервуарный парк',name:'Резервуары РВС-5000 №3–5',scene:'tanks'},
  {id:'CAM-03',unit:'Межцеховая эстакада',name:'Трубопроводы, участок 12',scene:'rack'},
  {id:'CAM-04',unit:'Каталитический риформинг',name:'Печь П-1 и реакторы Р-1…Р-3',scene:'reactor'},
  {id:'CAM-05',unit:'Эстакада налива',name:'Налив в ж/д цистерны, пост 2',scene:'loading'},
  {id:'CAM-06',unit:'Факельное хозяйство',name:'Факел высокого давления',scene:'flare'}
];
const camById=id=>CAMS.find(c=>c.id===id);
const TYPES={
  leak:{t:'Утечка продукта',i:'💧'},
  steam:{t:'Пропуск (парение) продукта',i:'♨️'},
  pipe:{t:'Повреждение трубопровода',i:'🔧'},
  equip:{t:'Повреждение оборудования / установки',i:'🏭'},
  fire:{t:'Возгорание / дым',i:'🔥'},
  ppe:{t:'Нарушение ТБ персоналом',i:'⛑️'},
  other:{t:'Прочее',i:'❓'}
};
const SEV={low:{t:'Низкий',c:'sv-low',sla:240},mid:{t:'Средний',c:'sv-mid',sla:60},high:{t:'Высокий',c:'sv-high',sla:15},crit:{t:'Критический',c:'sv-crit',sla:5}};
const DEPTS={
  mech:{name:'Служба механика установки',person:'Механик смены'},
  pb:{name:'Отдел промышленной безопасности',person:'Инженер ПБ'},
  toir:{name:'Служба ТОиР',person:'Мастер по ремонту'},
  unit:{name:'Начальник установки',person:'Начальник смены'},
  fire:{name:'Пожарная часть / диспетчер НПЗ',person:'Дежурный диспетчер'},
  ot:{name:'Отдел ОТ и ТБ',person:'Специалист по охране труда'},
  disp:{name:'Диспетчерская НПЗ',person:'Дежурный диспетчер'}
};
const ROUTE={leak:['mech','pb'],steam:['unit','mech'],pipe:['toir','pb'],equip:['toir','unit'],fire:['fire','pb'],ppe:['ot','unit'],other:['disp']};
const STATUSES=[['Передано','st-sent'],['В работе','st-work'],['Подтверждено','st-conf'],['Отклонено','st-rej'],['Устранено','st-done']];
const stCls=s=>(STATUSES.find(x=>x[0]===s)||['','st-sent'])[1];
const ANOM2TYPE={leak:'leak',steam:'steam',damage:'pipe',smoke:'fire',ppe:'ppe'};
const AI_LABEL={leak:'возможная утечка',steam:'парение / пропуск',damage:'повреждение',smoke:'дым',ppe:'нет каски'};

/* ================= Сцены видеонаблюдения (имитация) ================= */
const W=640,H=360,GY=292;
const SPOTS={
  column:[{x:240,y:230},{x:420,y:250},{x:140,y:250},{x:330,y:230}],
  tanks:[{x:135,y:272},{x:315,y:272},{x:495,y:272},{x:400,y:300}],
  rack:[{x:150,y:160},{x:330,y:205},{x:500,y:140},{x:420,y:230}],
  reactor:[{x:150,y:150},{x:320,y:255},{x:410,y:200},{x:250,y:200}],
  loading:[{x:200,y:205},{x:400,y:205},{x:300,y:250}],
  flare:[{x:250,y:282},{x:430,y:268},{x:360,y:240}]
};
const SCENE_TYPES={column:['leak','steam','damage','ppe'],tanks:['leak','damage','ppe','smoke'],rack:['leak','steam','damage','ppe'],reactor:['steam','leak','smoke','damage','ppe'],loading:['leak','steam','ppe'],flare:['leak','damage','ppe','smoke']};

function cyl(c,x,y,w,h,c1,c2){const g=c.createLinearGradient(x,0,x+w,0);g.addColorStop(0,c2);g.addColorStop(.38,c1);g.addColorStop(1,c2);c.fillStyle=g;c.fillRect(x,y,w,h)}
function dome(c,cx,y,rx,col){c.fillStyle=col||'#a9b2ba';c.beginPath();c.ellipse(cx,y,rx,rx*.55,0,Math.PI,0);c.fill()}

  else if(act==='break'){if(onBreak()){s.active.breaks[s.active.breaks.length-1].e=now;toast('Перерыв завершён','ok')}else{s.active.breaks.push({s:now,e:null});toast('Перерыв начат. Рекомендуем отдыхать 10 минут каждый час.','warn')}}
  else if(act==='end'){if(onBreak())s.active.breaks[s.active.breaks.length-1].e=now;const a=s.active;const br=a.breaks.reduce((x,b)=>x+(b.e-b.s),0);s.log.push({start:a.start,end:now,breakMs:br});const cnt=incidents.filter(i=>i.author===session.uid&&i.created>=a.start).length;s.active=null;toast('Смена завершена. Отработано '+fmtDur(now-a.start-br)+', замечаний: '+cnt,'ok',9000);speak('Смена завершена')}
  saveShifts();render();
}
function totals(){const s=myShift(),now=Date.now(),d0=new Date();d0.setHours(0,0,0,0);const all=s.log.concat(s.active?[s.active]:[]);
  const sum=from=>all.filter(x=>x.start>=from).reduce((m,x)=>m+workedMs(x,now),0);
  return{today:sum(d0.getTime()),week:sum(now-7*86400000),month:sum(now-30*86400000)}}

function notifs(){const uid=session.uid,u=USERS[uid];const out=[];
  incidents.forEach(i=>i.history.forEach(h=>{if(u.role==='operator'&&i.author===uid&&h.by!==uid)out.push({t:h.t,i,h});if(u.role==='specialist'&&h.s==='Передано')out.push({t:h.t,i,h})}));

function drawAll(force){const now=Date.now();$$('canvas[data-cam]').forEach(cv=>{const id=cv.dataset.cam;if(paused.has(id)&&!force&&!cv.closest('.modal'))return;if(paused.has(id)&&cv.dataset.drawn&&!cv.closest('.modal'))return;drawScene(cv.getContext('2d'),camById(id),now,cv.width);cv.dataset.drawn=1})}
let lastDraw=0;
function loop(ts){if(ts-lastDraw>(prefs.motion?250:66)){lastDraw=ts;if(view==='monitor'||$('#modalBg').classList.contains('open'))drawAll(false)}requestAnimationFrame(loop)}

/* ================= Генератор событий (демо) ================= */
let anomSeq=1;
function tick(){
  const now=Date.now();
  anomalies=anomalies.filter(a=>a.end>now);
  if(anomalies.length<3&&now>nextSpawn){
    const free=CAMS.filter(c=>!anomalies.some(a=>a.cam===c.id));const cam=free[Math.floor(Math.random()*free.length)];
    const types=SCENE_TYPES[cam.scene],type=types[Math.floor(Math.random()*types.length)],sp=SPOTS[cam.scene][Math.floor(Math.random()*SPOTS[cam.scene].length)];
    anomalies.push({id:anomSeq++,cam:cam.id,type,x:sp.x,y:sp.y,start:now,end:now+50000+Math.random()*40000,ai:Math.random()<.75,conf:62+Math.floor(Math.random()*34)});
    nextSpawn=now+14000+Math.random()*18000;
  }
  anomalies.forEach(a=>{if(a.ai&&!a.said&&now-a.start>2500){a.said=true;if(session&&USERS[session.uid].role==='operator'){speak('Подсказка ИИ: '+AI_LABEL[a.type]+', камера '+a.cam.slice(-2));announce('Подсказка ИИ: '+AI_LABEL[a.type]+' на камере '+a.cam)}}});
  updTele();
  if(view==='monitor'){CAMS.forEach(c=>{const el=$('#tele-'+c.id);if(el){el.innerHTML=teleHTML(c);el.closest('.cam-card').classList.toggle('alarm',!!el.querySelector('.bad'))}});renderHints()}
  const tf=$('#tele-full'),fc=$('.modal canvas[data-cam]');if(tf&&fc)tf.innerHTML=teleHTML(camById(fc.dataset.cam));
  updHeader();
}

/* ================= 3. Фиксация нарушений ================= */
function reportHTML(){
  const d=draft||{};const cam=d.cam?camById(d.cam):null;const type=d.type||'';
  const uid=session.uid,role=me().role;const list=incidents.filter(i=>role==='specialist'||i.author===uid).sort((a,b)=>b.created-a.created);
  return `${shiftBanner()}<h1>Фиксация потенциального нарушения</h1><p class="muted">Отметьте тип нарушения, критичность и место на стоп-кадре. Замечание автоматически уйдёт ответственной службе.</p>
  <form id="repForm" novalidate><div class="report-grid">
    <section class="panel">
      <fieldset class="types"><legend>1. Тип нарушения *</legend>${Object.entries(TYPES).map(([k,v])=>`<label class="opt"><input type="radio" name="type" value="${k}" ${type===k?'checked':''} required><span><span class="ico" aria-hidden="true">${v.i}</span>${v.t}</span></label>`).join('')}</fieldset>
      <fieldset class="sev"><legend style="width:100%">2. Уровень критичности *</legend>${Object.entries(SEV).map(([k,v])=>`<label class="opt"><input type="radio" name="sev" value="${k}" ${(d.sev||'mid')===k?'checked':''}><span class="${k==='crit'?'':v.c}">${v.t}</span></label>`).join('')}</fieldset>
      <div class="row" style="align-items:flex-start"><div class="field" style="flex:1;min-width:220px"><label for="rCam">3. Камера / установка *</label><select id="rCam" required><option value="">— выберите —</option>${CAMS.map(c=>`<option value="${c.id}" ${d.cam===c.id?'selected':''}>${c.id} · ${esc(c.unit)}</option>`).join('')}</select></div>
      <div class="field"><label>Время фиксации</label><div class="tv" style="min-height:44px;display:flex;align-items:center;font-size:1rem" id="rTime">${fmtDT(d.time||Date.now())}</div></div></div>
      <div class="field"><label for="rDesc">4. Описание</label><textarea id="rDesc" placeholder="Что видно, где именно, как развивается ситуация…">${esc(d.desc||'')}</textarea>
        <div class="row" style="margin-top:.4rem"><button type="button" class="btn sm" id="mic" hidden>🎤 Голосовой ввод</button><span class="muted" id="micSt"></span></div></div>
      <div class="field"><label for="rDept">5. Получатель</label><select id="rDept">${Object.entries(DEPTS).map(([k,v])=>`<option value="${k}">${v.name}</option>`).join('')}</select></div>
      <div class="route" id="route"></div>
      <p class="err" id="rErr" role="alert"></p>
      <div class="row"><button class="btn primary" type="submit">📤 Отправить ответственным</button><button class="btn" type="button" id="rClear">Очистить</button></div>
    </section>
    <section class="panel"><h2>Стоп-кадр</h2>
      <div class="snap" id="snap" tabindex="0" aria-label="Стоп-кадр. Нажмите на место нарушения, чтобы отметить его. Стрелки — сдвиг метки.">${d.snap?`<img src="${d.snap}" alt="Стоп-кадр камеры ${cam?cam.id:''}">${d.mark?`<span class="marker" style="left:${d.mark.x*100}%;top:${d.mark.y*100}%"></span>`:''}`:'<div class="empty">Нет стоп-кадра.<br>Выберите камеру и нажмите «Сделать стоп-кадр» или зафиксируйте нарушение со страницы наблюдения.</div>'}</div>
      <div class="row" style="margin-top:.7rem"><button type="button" class="btn" id="takeSnap">📷 Сделать стоп-кадр</button><button type="button" class="btn" id="clrMark" ${d.mark?'':'disabled'}>Убрать метку</button><span class="muted">${d.snap?(d.mark?'Место отмечено':'Нажмите на изображение, чтобы отметить место'):''}</span></div>
    </section>
  </div></form>
  <section class="panel" style="margin-top:1rem"><div class="row"><h2 style="margin:0">${role==='specialist'?'Все замечания':'Мои замечания'}</h2><span class="spacer"></span>
    <label class="sr" for="fSt">Фильтр по статусу</label><select id="fSt" style="width:auto"><option value="">Все статусы</option>${STATUSES.map(s=>`<option>${s[0]}</option>`).join('')}</select>
    <label class="sr" for="fTy">Фильтр по типу</label><select id="fTy" style="width:auto"><option value="">Все типы</option>${Object.entries(TYPES).map(([k,v])=>`<option value="${k}">${v.t}</option>`).join('')}</select></div>
    <div class="tbl-wrap" style="margin-top:.7rem"><table><thead><tr><th>№</th><th>Дата</th><th>Тип</th><th>Установка</th><th>Критичность</th><th>Получатель</th><th>Статус</th></tr></thead><tbody id="jBody">${journalRows(list)}</tbody></table></div></section>`;
}
function journalRows(list){return list.length?list.map(i=>`<tr><td><a href="#transfer" data-open="${i.id}">${i.id}</a></td><td>${fmtDT(i.created)}</td><td>${TYPES[i.type].i} ${TYPES[i.type].t}</td><td>${esc(i.unit)}</td><td><span class="tag ${SEV[i.sev].c}">${SEV[i.sev].t}</span></td><td>${DEPTS[i.dept].name}</td><td><span class="tag ${stCls(i.status)}">${i.status}</span></td></tr>`).join(''):'<tr><td colspan="7" class="muted">Замечаний пока нет</td></tr>'}
function bindReport(){
  bindBanner();
  if(!draft)draft={};
  const f=$('#repForm');
  const updRoute=()=>{const t=(f.querySelector('[name=type]:checked')||{}).value;const dept=$('#rDept').value;const cc=t?ROUTE[t].filter(x=>x!==dept):[];
    $('#route').innerHTML=t?`<b>Маршрут:</b> ${DEPTS[dept].name} (${DEPTS[dept].person})${cc.length?`<br><span class="muted">Копия: ${cc.map(x=>DEPTS[x].name).join(', ')}</span>`:''}<br><span class="muted">Срок реакции (SLA): ${SEV[(f.querySelector('[name=sev]:checked')||{}).value||'mid'].sla} мин</span>`:'<span class="muted">Выберите тип нарушения — получатель будет подобран автоматически.</span>'};
  const setType=()=>{const t=(f.querySelector('[name=type]:checked')||{}).value;if(t){$('#rDept').value=ROUTE[t][0];draft.type=t;if(t==='fire'){f.querySelector('[name=sev][value=crit]').checked=true}}updRoute()};
  if(draft.type)$('#rDept').value=draft.dept||ROUTE[draft.type][0];
  $$('[name=type]',f).forEach(r=>r.onchange=setType);$$('[name=sev]',f).forEach(r=>r.onchange=()=>{draft.sev=r.value;updRoute()});
  $('#rDept').onchange=()=>{draft.dept=$('#rDept').value;updRoute()};updRoute();
  $('#rDesc').oninput=e=>draft.desc=e.target.value;
  $('#rCam').onchange=e=>{draft.cam=e.target.value};
  $('#takeSnap').onclick=()=>{const id=$('#rCam').value;if(!id){$('#rErr').textContent='Сначала выберите камеру';$('#rCam').focus();return}draft.cam=id;draft.snap=snapshot(camById(id));draft.time=Date.now();draft.mark=null;render()};
  $('#clrMark').onclick=()=>{draft.mark=null;render()};
  const snap=$('#snap');
  snap.onclick=e=>{if(!draft.snap)return;const r=snap.getBoundingClientRect();draft.mark={x:(e.clientX-r.left)/r.width,y:(e.clientY-r.top)/r.height};render();$('#snap').focus()};
  snap.onkeydown=e=>{if(!draft.snap)return;const k={ArrowLeft:[-.03,0],ArrowRight:[.03,0],ArrowUp:[0,-.04],ArrowDown:[0,.04]}[e.key];if(e.key==='Enter'||e.key===' '){e.preventDefault();if(!draft.mark){draft.mark={x:.5,y:.5};render();$('#snap').focus()}return}
    if(k){e.preventDefault();if(!draft.mark)draft.mark={x:.5,y:.5};draft.mark.x=Math.min(1,Math.max(0,draft.mark.x+k[0]));draft.mark.y=Math.min(1,Math.max(0,draft.mark.y+k[1]));const m=$('.marker',snap);if(m){m.style.left=draft.mark.x*100+'%';m.style.top=draft.mark.y*100+'%'}else{render();$('#snap').focus()}}};
  $('#rClear').onclick=()=>{draft=null;render()};
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(SR){const mic=$('#mic');mic.hidden=false;mic.onclick=()=>{try{const r=new SR();r.lang='ru-RU';r.interimResults=false;$('#micSt').textContent='Говорите…';r.onresult=ev=>{const tx=ev.results[0][0].transcript;const ta=$('#rDesc');ta.value=(ta.value?ta.value+' ':'')+tx;draft.desc=ta.value};r.onend=()=>$('#micSt').textContent='';r.onerror=()=>$('#micSt').textContent='Голосовой ввод недоступен';r.start()}catch(e){$('#micSt').textContent='Голосовой ввод недоступен'}}}
  f.onsubmit=e=>{e.preventDefault();const type=(f.querySelector('[name=type]:checked')||{}).value,sev=(f.querySelector('[name=sev]:checked')||{}).value,cam=$('#rCam').value,desc=$('#rDesc').value.trim(),dept=$('#rDept').value;
    const errs=[];if(!type)errs.push('тип нарушения');if(!cam)errs.push('камеру');if(!draft.snap&&!desc)errs.push('стоп-кадр или описание');
    if(errs.length){$('#rErr').textContent='Укажите: '+errs.join(', ');return}
    const now=Date.now(),c=camById(cam);
    const inc={id:nextId(),cam,unit:c.unit,type,sev,created:now,author:session.uid,desc,dept,status:'Передано',snap:draft.snap||null,mark:draft.mark||null,history:[{s:'Передано',t:now,by:session.uid}],comments:[],shift:!!myShift().active};
    incidents.push(inc);saveInc();draft=null;
    if(sev==='crit'){toast(`🚨 <b>ЭКСТРЕННОЕ ОПОВЕЩЕНИЕ</b><br>${inc.id}: ${TYPES[type].t} — ${esc(c.unit)}. Оповещены: ${ROUTE[type].concat(dept).filter((x,i,a)=>a.indexOf(x)===i).map(x=>DEPTS[x].name).join(', ')}`,'bad',12000);speak('Экстренное оповещение отправлено')}
    else{toast(`✔ Замечание <b>${inc.id}</b> передано: ${DEPTS[dept].name}`,'ok');speak('Замечание передано')}
    announce('Замечание '+inc.id+' передано');render()};
  const jf=()=>{const st=$('#fSt').value,ty=$('#fTy').value;$('#jBody').innerHTML=journalRows(incidents.filter(i=>(me().role==='specialist'||i.author===session.uid)&&(!st||i.status===st)&&(!ty||i.type===ty)).sort((a,b)=>b.created-a.created));bindOpenLinks()};
  $('#fSt').onchange=jf;$('#fTy').onchange=jf;bindOpenLinks();
}
function bindOpenLinks(){$$('[data-open]').forEach(a=>a.onclick=e=>{e.preventDefault();openIncident(a.dataset.open)})}

/* ================= 4. Передача специалистам ================= */
let tf={mine:null,unit:'',sev:''};
function overdue(i){return i.status==='Передано'&&Date.now()-i.created>SEV[i.sev].sla*60000}
function transferHTML(){
  const u=me();if(tf.mine===null)tf.mine=u.role==='operator';
  const list=incidents.filter(i=>(!tf.mine||i.author===session.uid)&&(!tf.unit||i.unit===tf.unit)&&(!tf.sev||i.sev===tf.sev)).sort((a,b)=>(b.sev==='crit')-(a.sev==='crit')||b.created-a.created);
  const units=[...new Set(CAMS.map(c=>c.unit))];
  return `<h1>Передача информации ответственным специалистам</h1>
  <p class="muted">${u.role==='specialist'?'Входящие замечания от операторов-наблюдателей. Откройте карточку, чтобы взять в работу, подтвердить или отклонить.':'Отслеживайте, на каком этапе находятся ваши замечания, и получайте обратную связь от специалистов.'}</p>
  <div class="row" style="margin-bottom:1rem"><button class="btn sm" id="tMine" aria-pressed="${tf.mine}">Только мои</button>
    <label class="sr" for="tUnit">Установка</label><select id="tUnit" style="width:auto"><option value="">Все установки</option>${units.map(x=>`<option ${tf.unit===x?'selected':''}>${esc(x)}</option>`).join('')}</select>
    <label class="sr" for="tSev">Критичность</label><select id="tSev" style="width:auto"><option value="">Любая критичность</option>${Object.entries(SEV).map(([k,v])=>`<option value="${k}" ${tf.sev===k?'selected':''}>${v.t}</option>`).join('')}</select>
    <span class="spacer"></span><span class="muted">Просрочено: <b style="color:var(--bad)">${list.filter(overdue).length}</b></span></div>
  <div class="kanban">${STATUSES.map(([s,cl])=>{const items=list.filter(i=>i.status===s);return `<section class="col" aria-label="${s}"><h2><span class="tag ${cl}">${s}</span><span class="muted">${items.length}</span></h2>
    ${items.map(i=>`<button class="card" data-inc="${i.id}"><div class="row" style="gap:.35rem"><b>${i.id}</b><span class="tag ${SEV[i.sev].c}">${SEV[i.sev].t}</span>${overdue(i)?'<span class="tag overdue">SLA просрочен</span>':''}</div>
      ${i.snap?`<img class="thumb" src="${i.snap}" alt="">`:''}<div>${TYPES[i.type].i} ${TYPES[i.type].t}</div><small>${esc(i.unit)} · ${ago(i.created)}</small><small>→ ${DEPTS[i.dept].name}</small><small>Автор: ${esc(USERS[i.author]?USERS[i.author].name.split(' ').slice(0,2).join(' '):i.author)}</small></button>`).join('')||'<p class="muted" style="font-size:.9rem">Пусто</p>'}</section>`}).join('')}</div>
  <section class="panel" style="margin-top:1rem"><h2>Матрица маршрутизации</h2><div class="tbl-wrap"><table><thead><tr><th>Тип нарушения</th><th>Основной получатель</th><th>Копия</th></tr></thead><tbody>
    ${Object.entries(ROUTE).map(([k,r])=>`<tr><td>${TYPES[k].i} ${TYPES[k].t}</td><td>${DEPTS[r[0]].name}</td><td>${r.slice(1).map(x=>DEPTS[x].name).join(', ')||'—'}</td></tr>`).join('')}
    </tbody></table></div><p class="muted" style="margin-top:.6rem">Сроки реакции (SLA): критический — ${SEV.crit.sla} мин, высокий — ${SEV.high.sla} мин, средний — ${SEV.mid.sla} мин, низкий — ${SEV.low.sla} мин. Просроченные замечания эскалируются куратору.</p></section>`;
}
function bindTransfer(){
  $('#tMine').onclick=()=>{tf.mine=!tf.mine;render()};$('#tUnit').onchange=e=>{tf.unit=e.target.value;render()};$('#tSev').onchange=e=>{tf.sev=e.target.value;render()};
  $$('[data-inc]').forEach(b=>b.onclick=()=>openIncident(b.dataset.inc));
}
const NEXT={'Передано':[['В работе','Взять в работу','primary']],'В работе':[['Подтверждено','Подтвердить нарушение','ok'],['Отклонено','Отклонить','']],'Подтверждено':[['Устранено','Нарушение устранено','ok']]};
function openIncident(id){
  const i=incidents.find(x=>x.id===id);if(!i)return;const u=me(),spec=u.role==='specialist';const uname=k=>USERS[k]?USERS[k].name:k;
  openModal(`<div class="modal-head"><h2 id="modalTitle" style="margin:0">${i.id} · ${TYPES[i.type].i} ${TYPES[i.type].t}</h2><span class="tag ${stCls(i.status)}">${i.status}</span><span class="spacer"></span><button class="btn" data-close>✕ Закрыть</button></div>
  <div class="detail-grid"><div>${i.snap?`<div class="snap" style="cursor:default"><img src="${i.snap}" alt="Стоп-кадр нарушения">${i.mark?`<span class="marker" style="left:${i.mark.x*100}%;top:${i.mark.y*100}%"></span>`:''}</div>`:'<div class="snap"><div class="empty">Стоп-кадр не приложен</div></div>'}
    <dl class="kv"><dt>Установка</dt><dd>${esc(i.unit)} (${i.cam})</dd><dt>Критичность</dt><dd><span class="tag ${SEV[i.sev].c}">${SEV[i.sev].t}</span> ${overdue(i)?'<span class="tag overdue">SLA просрочен</span>':''}</dd><dt>Зафиксировано</dt><dd>${fmtDT(i.created)}</dd><dt>Автор</dt><dd>${esc(uname(i.author))}</dd><dt>Получатель</dt><dd>${DEPTS[i.dept].name} — ${DEPTS[i.dept].person}</dd><dt>Копия</dt><dd>${ROUTE[i.type].filter(x=>x!==i.dept).map(x=>DEPTS[x].name).join(', ')||'—'}</dd><dt>Описание</dt><dd>${esc(i.desc)||'<span class="muted">—</span>'}</dd></dl></div>
  <div>${spec&&NEXT[i.status]?`<div class="panel" style="margin-bottom:1rem"><h3>Действия специалиста</h3><label for="actC">Комментарий / принятые меры</label><textarea id="actC" style="min-height:70px"></textarea><div class="row" style="margin-top:.6rem">${NEXT[i.status].map(([s,t,cl])=>`<button class="btn ${cl}" data-st="${s}">${t}</button>`).join('')}</div></div>`:''}
    <h3>История</h3><ol class="timeline">${i.history.map(h=>`<li><span class="tag ${stCls(h.s)}">${h.s}</span> <span class="muted">${fmtDT(h.t)} · ${esc(uname(h.by))}</span>${h.c?`<div>${esc(h.c)}</div>`:''}</li>`).join('')}</ol>
    <h3 style="margin-top:1rem">Комментарии</h3>${(i.comments||[]).map(c=>`<div class="comment"><b>${esc(uname(c.by))}</b> <span class="muted">${fmtDT(c.t)}</span><div>${esc(c.text)}</div></div>`).join('')||'<p class="muted">Комментариев нет</p>'}
    <form id="cForm" class="row" style="margin-top:.5rem"><label class="sr" for="cTxt">Новый комментарий</label><input type="text" id="cTxt" placeholder="Написать комментарий…" style="flex:1;min-width:180px"><button class="btn">Отправить</button></form></div></div>`);
  $$('[data-st]').forEach(b=>b.onclick=()=>{const c=$('#actC').value.trim();if(b.dataset.st==='Отклонено'&&!c){alert('Укажите причину отклонения — это обратная связь для оператора.');$('#actC').focus();return}
    i.status=b.dataset.st;i.history.push({s:i.status,t:Date.now(),by:session.uid,c});saveInc();toast(`${i.id}: статус «${i.status}»`,'ok');render();openIncident(i.id)});
  $('#cForm').onsubmit=e=>{e.preventDefault();const t=$('#cTxt').value.trim();if(!t)return;(i.comments=i.comments||[]).push({by:session.uid,t:Date.now(),text:t});saveInc();openIncident(i.id)};
}

/* ================= Модальное окно ================= */
let lastFocus=null;
function openModal(html){if(!$('#modalBg').classList.contains('open'))lastFocus=document.activeElement;$('#modal').innerHTML=html;$('#modalBg').classList.add('open');$$('[data-close]',$('#modal')).forEach(b=>b.onclick=closeModal);const f=$('[data-close]',$('#modal'));f&&f.focus()}
function closeModal(){$('#modalBg').classList.remove('open');$('#modal').innerHTML='';if(lastFocus&&document.contains(lastFocus))lastFocus.focus()}
$('#modalBg').addEventListener('click',e=>{if(e.target.id==='modalBg')closeModal()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#modalBg').classList.contains('open'))closeModal()});

/* ================= Запуск ================= */
applyPrefs();seed();render();setInterval(tick,1000);requestAnimationFrame(loop);
</script>
</body>
